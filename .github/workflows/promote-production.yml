name: Promote production AAB

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full immutable main commit SHA that completed staging promotion.
        required: true
        type: string

concurrency:
  group: production-promotion-${{ inputs.commit_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-staging:
    name: Verify successful staging deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Check out main for commit validation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify SHA and staging environment deployment
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/ensure-main-commit.sh "$TARGET_SHA"
          deployment_id="$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$TARGET_SHA&environment=staging&per_page=100" \
            --jq '[.[] | select(.environment == "staging") | .id] | first // empty')"
          if [[ -z "$deployment_id" ]]; then
            echo "No staging environment deployment exists for $TARGET_SHA." >&2
            exit 1
          fi
          state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].state // empty')"
          if [[ "$state" != "success" ]]; then
            echo "Staging deployment $deployment_id for $TARGET_SHA is not successful (state: ${state:-missing})." >&2
            exit 1
          fi

  production:
    needs: verify-staging
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/android-build.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      promotion_environment: production
      signing_profile: play-upload
      aws_role_arn: ${{ vars.AWS_PRODUCTION_PLAY_UPLOAD_SIGNING_ROLE_ARN || vars.AWS_PRODUCTION_SIGNING_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION }}
      build_kind: production
      build_label: ${{ github.run_number }}
      artifact_name: toastlift-production-${{ inputs.commit_sha }}
      verify_play_release: true
      publish_github_release: true
