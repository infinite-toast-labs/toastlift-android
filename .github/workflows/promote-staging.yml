name: Promote staging APK

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full immutable main commit SHA to promote.
        required: true
        type: string

concurrency:
  group: staging-promotion-${{ inputs.commit_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/android-build.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
      promotion_environment: staging
      signing_profile: staging
      aws_role_arn: ${{ vars.AWS_STAGING_SIGNING_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION }}
      build_kind: staging
      build_label: ${{ github.run_number }}
      artifact_name: toastlift-staging-${{ inputs.commit_sha }}
